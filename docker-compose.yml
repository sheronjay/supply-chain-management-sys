services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    container_name: supply_frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  backend:
    build: ./backend
    container_name: supply_backend
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: group_19
      DB_PASSWORD: group#19
      DB_NAME: supplychain
      DB_CONNECTION_LIMIT: 10
      JWT_SECRET: supersecretkey
      JWT_EXPIRES_IN: 1h
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: supply_db
    environment:
      MYSQL_ROOT_PASSWORD: group#19
      MYSQL_DATABASE: supplychain
      MYSQL_USER: group_19
      MYSQL_PASSWORD: group#19
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "group_19", "-pgroup#19"]
      interval: 5s
      timeout: 3s
      retries: 30

  adminer:
    image: adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db-data:
